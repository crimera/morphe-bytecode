name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify artifact layout
        run: |
          set -euo pipefail
          ./gradlew jar --no-daemon
          JAR=$(ls build/libs/morphe-bytecode-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -q 'app/crimera/bytecode/Block.class'
          unzip -l "$JAR" | grep -q 'META-INF/NOTICE'
          echo "$JAR: classes at the root, notices in META-INF"

      - name: Test
        run: ./gradlew test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: |
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            ./gradlew publish --no-daemon -PbytecodeVersion=${{ steps.version.outputs.value }}
          else
            ./gradlew publish --no-daemon
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
